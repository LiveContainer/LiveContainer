name: Home Screen - Simulator Preview
on:
  workflow_dispatch:
  push:
    branches: ['codex/**']
    paths:
      - 'LiveContainerSwiftUI/HomeScreen/**'
      - 'LiveContainerSwiftUI/Views/AppList/**'
      - 'LiveContainerSwiftUI/Views/LCTabView.swift'
      - 'LiveContainerSwiftUI/Views/Settings/LCSettingsView.swift'
      - 'Tests/HomeScreenPreview/**'
      - 'scripts/home_screen_preview.py'
      - 'scripts/build_home_preview.py'
      - '.github/workflows/home-screen-preview.yml'
permissions:
  contents: read
jobs:
  preview:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'
      - name: Compile production desktop sources in a native component fixture host
        run: |
          set -o pipefail
          python3 scripts/build_home_preview.py 2>&1 | tee simulator-build.log
      - name: Capture native light and dark desktop layouts with test fixture metadata
        run: python3 scripts/home_screen_preview.py --component
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-home-screen-preview
          path: |
            simulator-build.log
            artifacts/home-preview/
          if-no-files-found: error
